<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik's Cube Solver Web-App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <header class="app-header">
            <div>
                <p class="eyebrow">Rubik's Cube Solver</p>
                <h1>Scan Your Cube</h1>
            </div>
            <div class="connection-block">
                <button id="connect-bluetooth" class="connection-button" type="button">
                    Connect HM-10
                </button>
                <p id="bluetooth-status" class="bluetooth-status" role="status" aria-live="polite">
                    Not connected.
                </p>
            </div>
        </header>

        <div class="workspace">
            <section class="scanner-panel" aria-label="Camera scanner">
                <div class="video-container">
                    <video id="camera-feed" autoplay playsinline muted></video>
                    <div class="camera-placeholder" id="camera-placeholder">
                        <span>Camera off</span>
                    </div>
                    <div class="scan-grid" aria-hidden="true">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                    </div>
                </div>

                <div class="scanner-actions">
                    <button id="start-camera" class="primary-button" type="button">
                        Turn On Camera
                    </button>
                    <select id="face-select" aria-label="Face being scanned">
                        <option value="U">U — Up</option>
                        <option value="R">R — Right</option>
                        <option value="F">F — Front</option>
                        <option value="D">D — Down</option>
                        <option value="L">L — Left</option>
                        <option value="B">B — Back</option>
                    </select>
                    <button id="capture-face" class="capture-button" type="button" disabled>
                        Capture U
                    </button>
                </div>
                <p id="scan-status" class="status" role="status" aria-live="polite">
                    Turn on the camera to begin.
                </p>
            </section>

            <aside class="workflow-panel">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">Cube faces</p>
                        <h2 id="progress-heading">0 of 6 captured</h2>
                    </div>
                </div>
                <div id="face-progress" class="face-progress" aria-labelledby="progress-heading"></div>

                <details class="review-details" open>
                    <summary>Review detected colors</summary>
                    <p>Click a sticker to cycle its color. Center stickers stay fixed.</p>
                    <div id="face-review" class="face-review"></div>
                </details>

                <div class="solution-panel">
                    <div id="result-display" class="result" aria-live="polite">
                        Capture all six faces to generate a solution.
                    </div>
                    <div class="solution-actions">
                        <button id="solve-cube" class="solve-button" type="button" disabled>
                            Solve cube
                        </button>
                        <button id="send-solution" class="send-button" type="button" disabled>
                            Send solution
                        </button>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <!-- Include both required parts of cubejs library -->
    <script src="https://unpkg.com/cubejs@1.3.0/lib/cube.js"></script>
    <script src="https://unpkg.com/cubejs@1.3.0/lib/solve.js"></script>
    
    <!-- Include your app logic last -->
    <script src="app.js"></script>
</body>
</html>
